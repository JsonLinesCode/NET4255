services:
  flask1:
    build:
      context: ..
    image: webnodb
    command: python -m flask --app flask_app1 run --host=0.0.0.0 --debug
    expose:
      - "5000"
    develop:
      watch:
        - action: sync
          path: ..
          target: /app
          ignore:
            - .git
            - __pycache__
            - .venv
            - docker/
    networks:
      - app_network

  flask2:
    build:
      context: ..
    image: webdb
    command: python -m flask --app flask_app2 run --host=0.0.0.0 --debug
    environment:
      - MONGO_URL=mongodb://mongo:27017/
    depends_on:
      - mongo
    expose:
      - "5000"
    develop:
      watch:
        - action: sync
          path: ..
          target: /app
          ignore:
            - .git
            - __pycache__
            - .venv
            - docker/
    networks:
      - app_network

  mongo:
    image: mongo:latest
    networks:
      - app_network
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:alpine
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - flask1
      - flask2
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
